name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_CMS_URL: "https://cms-dashboard.mukund-reality.workers.dev"
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyBAWxEWD4FZhaaAMrX0bOhIjDiDNw-TTZI"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "mukund-website.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "mukund-website"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "mukund-website.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1096106264501"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:1096106264501:web:be9f96d2a75978871ffbfc"
